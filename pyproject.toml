[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "systrade"
version = "0.1.0"
description = "Systematic trading framework — Carver methodology"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=14.0",       # moteur parquet
    "requests>=2.31",
    "python-dotenv>=1.0",  # lecture du .env
    "tiingo>=0.14",        # données EOD
    "fredapi>=0.5",        # taux FRED
    "pyyaml>=6.0",         # config instruments.yaml
    "scipy>=1.13",         # stats (skewness, percentiles)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
reporting = [
    "quantstats>=0.0.62",
    "plotly>=5.18",
    "matplotlib>=3.8",
]
live = [
    "alpaca-py>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/systrade"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # erreurs, warnings, imports

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
