# ── Paramètres globaux ──
trading:
  vol_target: 0.13             # volatility target annualisé
  max_leverage: 2.0            # levier brut maximum
  margin_alert: 1.5            # seuil d'alerte marge préventive
  buffer_delta: 0.10           # buffer ± 10% de la position cible
  circuit_breaker_pct: 0.05    # arrêt si P&L jour < -5% du capital
  capital: 100_000             # capital de départ (USD)
  annualisation_factor: 256    # jours de trading (√256 = 16)

# ── Paramètres EWMAC ──
ewmac:
  variations:
    - {fast: 8,  slow: 32,  weight: 0.333}   # poids pour trend-only
    - {fast: 16, slow: 64,  weight: 0.333}
    - {fast: 32, slow: 128, weight: 0.333}
  # poids pour instruments trend+carry (renormalisés)
  weight_with_carry: 0.2333
  forecast_cap: 20.0

# ── Paramètres Carry ──
carry:
  variations:
    - {name: medium, ema_span: 5,  weight: 0.150}
    - {name: slow,   ema_span: 20, weight: 0.150}
  fred_cash_rate: "DTB3"       # T-bill 3 mois

# ── Paramètres Volatilité ──
volatility:
  ewma_span: 35                # span de l'EWMA
  lt_blend_weight: 0.30        # poids de la vol long terme (30%)
  lt_window_years: 10          # fenêtre vol long terme
  floor_percentile: 5          # plancher = 5e percentile sur 500 jours
  floor_lookback: 500
  min_observations: 10         # minimum avant de produire une estimation
